<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=390" />
<title>LF-09 거주 재확인</title>
<link rel="stylesheet" href="../src/lofi.css" />
<style>
  .sheet .hami { display: flex; justify-content: center; }
  .sheet .hami img { width: 140px; margin: -16px 0 -18px; }
  .sheet h2 { font-size: 20px; font-weight: 700; text-align: center; letter-spacing: -0.02em; }
  .sheet .lead { text-align: center; }
  .if { margin-top: 18px; border-radius: 14px; background: var(--gray-50); padding: 12px 16px; font-size: 13.5px; line-height: 1.55; color: var(--gray-600); }
</style>
</head>
<body>
<div class="phone" data-bare="on">
  <iframe class="bg" src="03-resident-home-a.html" title="배경: 거주자 홈"></iframe>
  <div class="dim"></div>
  <div class="sheet" role="dialog" aria-labelledby="t">
    <div class="grabber"></div>
    <div class="hami"><img src="../assets/hami/house.png" alt="함이가 집 카드를 들고 묻고 있어요" /></div>
    <h2 id="t" class="mt-8">아직 햇살빌라에 살고 있나요?</h2>
    <p class="small lead mt-4">1년에 한 번 연결 상태를 확인해요.</p>
    <div class="if">답하지 않으면 14일 뒤 새 글쓰기와 공지 알림이 잠시 멈춰요. 안내는 계속 읽을 수 있고, 언제든 ‘아직 살아요’로 되돌릴 수 있어요.</div>
    <div class="btn-row mt-20">
      <button class="btn btn-neutral">이사했어요</button>
      <button class="btn btn-primary grow">아직 살아요</button>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="../src/chrome.js"></script>
</body>
</html>
