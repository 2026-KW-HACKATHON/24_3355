<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=390" />
<title>LF-12 건물 확인 · 집주인</title>
<link rel="stylesheet" href="../src/lofi.css" />
<style>
  .head { display: flex; align-items: flex-end; justify-content: space-between; }
  .head img { width: 118px; margin: -14px -14px -12px 0; }
  .input.lock { background: var(--gray-100); color: var(--gray-700); }
  .ask { display: flex; align-items: center; gap: 8px; margin-top: 24px; padding: 12px 14px; border-radius: 14px; background: var(--gray-50); font-size: 14px; color: var(--gray-700); }
  .ask svg { width: 17px; height: 17px; color: var(--gray-500); flex: none; }
  .ask b { margin-left: auto; font-size: 14px; color: var(--navy-600); white-space: nowrap; }
</style>
</head>
<body>
<div class="phone">
  <div class="content">
    <div class="topbar">
      <button class="icon-btn" aria-label="닫기"><i data-lucide="x"></i></button>
      <span class="title">건물 확인</span>
      <span style="width:44px"></span>
    </div>
    <div class="pad">
      <div class="head mt-8">
        <h1 class="h-title">초대받은 건물이<br />맞나요?</h1>
        <img src="../assets/hami/clipboard.png" alt="함이가 체크보드에 적고 있어요" />
      </div>

      <div class="field-label mt-24">건물 이름</div>
      <div class="input focus">햇살빌라<span class="caret" style="height:18px"></span></div>
      <p class="caption mt-8">현관 QR을 연 사람이 가장 먼저 보는 이름이에요. 바꿀 수 있어요.</p>

      <div class="field-label mt-20">주소 <span class="opt">월계함 팀이 확인한 주소</span></div>
      <div class="input lock"><i data-lucide="lock"></i>서울 노원구 월계동 000-00</div>
      <p class="caption mt-8">공개 화면에는 ‘월계동 OO길’까지만 보여요.</p>

      <div class="ask"><i data-lucide="circle-help"></i>주소가 다르거나 건물이 여러 개예요<b>팀에 알리기</b></div>
    </div>
  </div>
  <div class="cta-dock">
    <button class="btn btn-primary">맞아요, 안내 쓰기</button>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="../src/chrome.js"></script>
</body>
</html>
