<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=390" />
<title>LF-09 이사 처리 확인</title>
<link rel="stylesheet" href="../src/lofi.css" />
<style>
  .sheet h2 { font-size: 21px; font-weight: 700; letter-spacing: -0.02em; }
  .cmp { margin-top: 18px; border-radius: 16px; background: var(--gray-50); padding: 14px 16px; }
  .cmp .h { font-size: 13px; font-weight: 700; color: var(--gray-500); margin-bottom: 6px; }
  .cmp .i { display: flex; gap: 10px; align-items: center; font-size: 15px; line-height: 1.5; padding: 4px 0; color: var(--gray-800); }
  .cmp .i svg { width: 18px; height: 18px; flex: none; stroke-width: 2.4; }
  .cmp .end svg { color: var(--gray-500); }
  .cmp .keep svg { color: var(--st-done); }
  .cmp + .cmp { margin-top: 8px; }
</style>
</head>
<body>
<div class="phone" data-bare="on">
  <iframe class="bg" src="45-me.html" title="배경: 내 정보"></iframe>
  <div class="dim"></div>
  <div class="sheet" role="dialog" aria-labelledby="t">
    <div class="grabber"></div>
    <h2 id="t">햇살빌라에서 이사했나요?</h2>
    <p class="small mt-4">이사 처리 후에도 계정은 그대로 남아요.</p>
    <div class="cmp end">
      <div class="h">끝나는 것</div>
      <div class="i"><i data-lucide="minus-circle"></i>이 건물의 생활 팁 읽기·쓰기</div>
      <div class="i"><i data-lucide="minus-circle"></i>이 건물의 공지 알림</div>
    </div>
    <div class="cmp keep">
      <div class="h">건물에 그대로 남는 것</div>
      <div class="i"><i data-lucide="check-circle-2"></i>기본 안내와 남겨진 생활 팁</div>
    </div>
    <div class="cmp keep">
      <div class="h">내가 계속 볼 수 있는 것</div>
      <div class="i"><i data-lucide="check-circle-2"></i>보낸 내용의 처리 상태 (보관 기간 안에서)</div>
    </div>
    <div class="btn-row mt-20">
      <button class="btn btn-neutral">계속 거주해요</button>
      <button class="btn btn-primary">이사했어요</button>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="../src/chrome.js"></script>
</body>
</html>
