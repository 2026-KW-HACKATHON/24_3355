<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=390" />
<title>LF-02 기본 안내 없음</title>
<link rel="stylesheet" href="../src/lofi.css" />
</head>
<body>
<div class="phone">
  <div class="content">
    <div class="topbar">
      <button class="icon-btn" aria-label="뒤로"><i data-lucide="chevron-left"></i></button>
      <span class="title">건물 안내</span>
      <span style="width:44px"></span>
    </div>
    <div class="pad">
      <p class="caption mt-8">새봄하우스 · 월계동</p>
      <div class="empty" style="margin-top:88px">
        <img src="../assets/hami/folder.png" alt="함이가 빈 폴더를 펼쳐 들고 있어요" />
        <div class="t">아직 등록된 안내가 없어요</div>
        <div class="s">집주인이 안내를 등록하면<br />여기에서 바로 볼 수 있어요.</div>
      </div>
    </div>
  </div>
  <div class="cta-dock">
    <p class="hint">급한 일은 연락처 없이도 전할 수 있어요</p>
    <button class="btn btn-secondary"><i data-lucide="mail"></i>집주인에게 알리기</button>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="../src/chrome.js"></script>
</body>
</html>
