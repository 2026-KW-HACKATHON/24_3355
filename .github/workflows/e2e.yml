name: End-to-end tests

# 끝까지 해보는 테스트(Playwright, e2e/). 새 DB에 마이그레이션·시드한 뒤 `pnpm dev`(웹 5173 + API 3001)에 붙어서 돕니다.
# 값은 모두 CI 전용이고 비밀이 아닙니다(VAPID 키도 실행할 때마다 새로 만듦). 클라우드 자격 증명을 받지 않습니다.
on:
  pull_request:
    paths:
      - apps/**
      - packages/**
      - e2e/**
      - playwright.config.ts
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/e2e.yml
  push:
    branches: [main]
    paths:
      - apps/**
      - packages/**
      - e2e/**
      - playwright.config.ts
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/e2e.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: wolgyeham
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: wolgyeham
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wolgyeham -d wolgyeham"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      CI: "true"
      DATABASE_URL: postgresql://wolgyeham:ci-only@127.0.0.1:5432/wolgyeham
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Write CI env files
        run: |
          vapid="$(pnpm --silent --filter @wolgyeham/api exec web-push generate-vapid-keys --json)"
          public_key="$(node -e 'console.log(JSON.parse(process.argv[1]).publicKey)' "$vapid")"
          private_key="$(node -e 'console.log(JSON.parse(process.argv[1]).privateKey)' "$vapid")"
          echo "::add-mask::$private_key"
          cat > apps/api/.env <<EOF
          NODE_ENV=development
          API_HOST=127.0.0.1
          API_PORT=3001
          DATABASE_URL=$DATABASE_URL
          APP_ORIGIN=http://localhost:5173
          SESSION_SECRET=ci-only-session-secret-0123456789abcdef
          DEMO_MODE=true
          E2E_LOGIN=true
          TRUSTED_PROXY_HOPS=0
          VAPID_PUBLIC_KEY=$public_key
          VAPID_PRIVATE_KEY=$private_key
          VAPID_SUBJECT=mailto:ci@example.com
          PHOTO_STORE=local
          PHOTO_LOCAL_DIR=.data/photos
          EOF
          cat > apps/web/.env <<EOF
          API_PROXY_TARGET=http://127.0.0.1:3001
          EOF

      - run: pnpm db:migrate
      - run: pnpm db:seed

      - name: Install Chrome for Playwright
        run: pnpm exec playwright install --with-deps --force chrome

      - name: Start dev server
        run: |
          nohup pnpm dev > dev-server.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:5173/api/health > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "dev server did not become healthy"
          cat dev-server.log
          exit 1

      - run: pnpm e2e

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            node_modules/.cache/playwright/results
            dev-server.log
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: ignore
